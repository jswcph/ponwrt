name: Ponwrt-Copy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 6'  # 北京时间每周日 01:00 自动构建

permissions:
  contents: read

concurrency:
  group: ponwrt-copy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Mihomo Meta core
        run: |
          set -euo pipefail

          CORE_DIR="package/ponwrt-mihomo/files"
          CORE_URL="https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-arm64.tar.gz"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          mkdir -p "$CORE_DIR" "$WORK_DIR/extract"

          # 下载内核压缩包
          curl -fL --retry 3 "$CORE_URL" -o "$WORK_DIR/core.tar.gz"
          tar -tzf "$WORK_DIR/core.tar.gz"

          # 解压到独立临时目录，避免误取 files/ 目录里的其他文件
          tar -xzf "$WORK_DIR/core.tar.gz" -C "$WORK_DIR/extract"

          # 优先按常见名称查找，找不到再挑选第一个 ELF 可执行文件
          bin=""
          for name in clash clash_meta mihomo; do
            found="$(find "$WORK_DIR/extract" -type f -name "$name" -print -quit)"
            if [ -n "$found" ]; then
              bin="$found"
              break
            fi
          done

          if [ -z "$bin" ]; then
            while IFS= read -r f; do
              if file "$f" | grep -q 'ELF'; then
                bin="$f"
                break
              fi
            done < <(find "$WORK_DIR/extract" -type f)
          fi

          [ -n "$bin" ] || { echo "Mihomo core binary not found in archive"; exit 1; }

          rm -f "$CORE_DIR/clash_meta"
          install -m 0755 "$bin" "$CORE_DIR/clash_meta"

          # 校验：文件非空，且必须是 aarch64 的 ELF 可执行文件
          test -s "$CORE_DIR/clash_meta"
          file "$CORE_DIR/clash_meta"
          file "$CORE_DIR/clash_meta" | grep -q 'ELF 64-bit.*ARM aarch64' || {
            echo "ERROR: core is not an ELF aarch64 binary"
            exit 1
          }

          ls -l "$CORE_DIR"

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: |
          # 先并行编译；失败后用 -j1 V=sc 重跑，输出完整的错误日志
          make -j"$(nproc)" V=sc || make -j1 V=sc

      - name: Collect ${{ matrix.target }} firmware
        run: |
          set -e
          TARGET_DIR="bin/targets/airoha/${{ matrix.target }}"
          RELEASE_DIR="release"
          mkdir -p "$RELEASE_DIR"

          echo "=== Firmware files ==="
          find "$TARGET_DIR" -type f \( -name '*.itb' -o -name '*.bin' -o -name '*.img' -o -name '*.img.gz' \) -print

          find "$TARGET_DIR" -type f \( -name '*.itb' -o -name '*.bin' -o -name '*.img' -o -name '*.img.gz' \) \
            -exec cp -t "$RELEASE_DIR" {} +

          count="$(find "$RELEASE_DIR" -maxdepth 1 -type f \( -name '*.itb' -o -name '*.bin' -o -name '*.img' -o -name '*.img.gz' \) | wc -l)"

          [ "$count" -gt 0 ] || {
            echo "ERROR: No firmware image found for ${{ matrix.target }}"
            exit 1
          }

          echo "Collected $count firmware file(s)."

          tar --zstd -cf "$RELEASE_DIR/ponwrt-${{ matrix.target }}.tar.zst" \
            -C "$TARGET_DIR" .

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Ponwrt-*
          path: release
          merge-multiple: true

      - name: Verify release files
        working-directory: release
        run: |
          set -e
          echo "=== Release files ==="
          ls -lah

          count="$(find . -maxdepth 1 -type f \( -name '*.itb' -o -name '*.bin' -o -name '*.img' -o -name '*.img.gz' \) | wc -l)"

          [ "$count" -gt 0 ] || {
            echo "ERROR: No firmware image was collected."
            exit 1
          }

          sha256sum \
            *.itb \
            *.bin \
            *.img \
            *.img.gz \
            2>/dev/null > sha256sums || true

          [ -s sha256sums ] || {
            echo "ERROR: Failed to generate sha256sums."
            exit 1
          }

      - name: Generate release tag
        id: tag
        run: |
          TAG="R$(date -u '+%Y.%m.%d.%H%M')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          shopt -s nullglob
          files=(release/*.itb release/*.bin release/*.img release/*.img.gz release/*.tar.zst release/sha256sums)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found in release/"
            exit 1
          fi

          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')

          cat > release_notes.md << EOF
          编译时间：${BUILD_TIME}（北京时间）

          ## 支持机型

          | 平台 | 型号 |
          |------|------|
          | AN7581 | FiberHome HG5382A |
          | AN7581 | FiberHome HG5585F CT |
          | AN7581 | FiberHome HG5585F CU |
          | AN7581 | Gemtek XG2010G |
          | AN7581 | Nokia XG-040G-MD UBI |
          | AN7581 | Nokia XG-040G-TF UBI |
          | AN7581 | UnionMan UNG00A |
          | AN7581 | ZNXT ZN504XG-D |
          | AN7581 | ZNXT ZN515XG-D |
          | AN7583 | Nokia XG-040G-MF |

          ## 内置插件
          - Passwall（Xray+Singbox）
          - OpenClash（Mihomo内核）
          - Argon 主题及主题设置面板，已默认启用并汉化

          ## 默认参数

          | 项目 | 值 |
          |------|-----|
          | 主机名 | OpenWrt |
          | 默认密码 | password |
          | LAN 地址 | 192.168.6.1 |
          | Wan口 | Pon口 |
          | Lan口 | lan1~lan4 |
          | 默认主题 | Argon |

          本项目仅供个人学习测试使用，请勿转发或商用盈利，本仓库不承担法律责任。
          EOF

          gh release create "$RELEASE_TAG" \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PonWrt ${RELEASE_TAG}" \
            --notes-file release_notes.md
