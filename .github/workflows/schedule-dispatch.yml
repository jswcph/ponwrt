name: Schedule PonWrt Builds

on:
  workflow_dispatch:
  schedule:
    # 每周六凌晨 01:00（北京时间）
    # GitHub Actions 使用 UTC，因此为周五 17:00 UTC
    - cron: '0 17 * * 5'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch PonWrt Builds
    runs-on: ubuntu-latest

    steps:
      - name: Trigger 2.5G-Wan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 2.5G-Wan.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref 2.5G-Wan

      - name: Trigger Pon-Wan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run Pon-Wan.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref Pon-Wan
